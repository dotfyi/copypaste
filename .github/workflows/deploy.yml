name: Deploy copypaste
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build React app
        run: npm run build
      - name: Verify generated Rhea auth styles
        run: node -e 'const fs=require("node:fs"); const p="public/assets"; const css=fs.readdirSync(p).filter(x=>x.endsWith(".css")).map(x=>fs.readFileSync(p+"/"+x,"utf8")).join("\\n"); for(const s of [".max-w-md",".flex-col",".cn-card",".cn-button"]) if(!css.includes(s)) throw new Error("Missing generated CSS selector: "+s); console.log("Rhea auth CSS selectors verified")'
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}