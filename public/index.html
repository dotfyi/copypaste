<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="copypaste — одна думка на день. Спільний потік повідомлень.">
  <title>copypaste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink:#111; --muted:#858585; --line:#e7e7e7; --soft:#f5f5f5; }
    * { box-sizing:border-box; }
    html { background:#fff; }
    body { margin:0; background:#fff; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    .shell { width:min(100% - 48px, 760px); margin:0 auto; padding:58px 0 80px; }
    header { display:flex; align-items:baseline; justify-content:space-between; gap:20px; margin-bottom:48px; }
    .brand { font-size:clamp(38px,8vw,54px); font-weight:800; letter-spacing:-.075em; line-height:1; }
    .tagline { color:var(--muted); font-size:13px; letter-spacing:.015em; }
    .composer { margin-bottom:38px; }
    textarea { display:block; width:100%; min-height:116px; resize:vertical; border:1px solid #d9d9d9; border-radius:8px; padding:18px 18px; color:var(--ink); background:#fff; font:400 17px/1.55 inherit; font-family:inherit; font-size:17px; line-height:1.55; outline:none; transition:border-color .15s; }
    textarea::placeholder { color:#a0a0a0; }
    textarea:focus { border-color:#777; }
    textarea:disabled { background:#fff; color:#777; resize:none; }
    .compose-row { display:flex; justify-content:space-between; align-items:center; gap:16px; margin-top:12px; }
    .counter,.hint { color:var(--muted); font-size:13px; }
    button { border:0; border-radius:7px; background:#111; color:#fff; padding:13px 20px; min-height:46px; font:600 14px inherit; font-family:inherit; font-size:14px; cursor:pointer; transition:opacity .15s, transform .15s; }
    button:hover:not(:disabled) { opacity:.82; }
    button:active:not(:disabled) { transform:translateY(1px); }
    button:disabled { opacity:.35; cursor:not-allowed; }
    .status { min-height:20px; margin-top:10px; color:var(--muted); font-size:12px; }
    .feed-head { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:20px 0 17px; border-top:1px solid var(--line); }
    .feed-title { font-size:13px; font-weight:700; letter-spacing:.01em; }
    .feed-count { color:var(--muted); font-size:12px; }
    .post { padding:23px 0 25px; border-top:1px solid var(--line); }
    .meta { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:13px; color:var(--muted); font-size:13px; }
    .identity { display:flex; align-items:center; gap:10px; min-width:0; }
    .swatch { width:11px; height:11px; flex:0 0 11px; border-radius:3px; }
    .hex { letter-spacing:.015em; }
    time { white-space:nowrap; }
    .message { margin:0; font-size:clamp(17px,3.2vw,20px); line-height:1.55; letter-spacing:-.025em; overflow-wrap:anywhere; white-space:pre-wrap; }
    .empty { padding:38px 0; color:var(--muted); text-align:center; font-size:14px; border-top:1px solid var(--line); }
    .footer { margin-top:38px; padding-top:18px; border-top:1px solid var(--line); color:#aaa; font-size:11px; text-align:center; letter-spacing:.08em; }
    .error { color:#b42318; }
    @media (max-width:560px) {
      .shell { width:min(100% - 36px, 760px); padding:35px 0 56px; }
      header { align-items:flex-start; flex-direction:column; gap:9px; margin-bottom:34px; }
      .tagline { font-size:12px; }
      textarea { min-height:108px; font-size:16px; padding:15px; }
      .compose-row { align-items:center; }
      button { padding:12px 16px; min-height:43px; }
      .post { padding:20px 0 22px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand">copypaste</div>
      <div class="tagline">одна думка. один день.</div>
    </header>

    <section class="composer" aria-label="Нове повідомлення">
      <textarea id="message" maxlength="280" placeholder="Про що ти думаєш сьогодні?" aria-label="Твоє повідомлення"></textarea>
      <div class="compose-row">
        <span class="counter" id="counter">0 / 280</span>
        <button id="publish" type="button" disabled>Опублікувати ↗</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">Підключаємося…</div>
    </section>

    <section aria-label="Усі повідомлення">
      <div class="feed-head">
        <span class="feed-title">Усі повідомлення</span>
        <span class="feed-count" id="feed-count">—</span>
      </div>
      <div id="feed" aria-live="polite"><div class="empty">Завантажуємо потік…</div></div>
    </section>
    <footer class="footer">COPypaste · ПИШИ РАЗ НА ДЕНЬ</footer>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';

    const SUPABASE_URL = 'https://ebngdngtlrzdzaojsggl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QxMbOMYZY_JcIO2M5ozPDQ_Uc4mykOf';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });

    const input = document.querySelector('#message');
    const counter = document.querySelector('#counter');
    const publish = document.querySelector('#publish');
    const status = document.querySelector('#status');
    const feed = document.querySelector('#feed');
    const feedCount = document.querySelector('#feed-count');
    let currentUser = null;
    let myHex = null;
    let alreadyPosted = false;

    const kyivDate = (value) => new Intl.DateTimeFormat('uk-UA', {
      day:'2-digit', month:'2-digit', year:'numeric', timeZone:'Europe/Kyiv'
    }).format(new Date(value));
    const kyivTime = (value) => new Intl.DateTimeFormat('uk-UA', {
      hour:'2-digit', minute:'2-digit', timeZone:'Europe/Kyiv'
    }).format(new Date(value));

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function updateComposer() {
      counter.textContent = input.value.length + ' / 280';
      publish.disabled = !currentUser || alreadyPosted || !input.value.trim() || input.value.length > 280;
    }

    async function ensureIdentity() {
      const { data: sessionData } = await supabase.auth.getSession();
      if (sessionData.session?.user) {
        currentUser = sessionData.session.user;
      } else {
        const { data, error } = await supabase.auth.signInAnonymously();
        if (error) throw error;
        currentUser = data.user;
      }

      let profile = null;
      for (let attempt = 0; attempt < 6; attempt++) {
        const { data, error } = await supabase
          .from('copypaste_profiles')
          .select('hex_login')
          .eq('id', currentUser.id)
          .maybeSingle();
        if (!error && data) { profile = data; break; }
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      if (!profile) throw new Error('Не вдалося створити твій HEX-логін. Онови сторінку.');
      myHex = profile.hex_login;
    }

    function renderPosts(posts) {
      feedCount.textContent = posts.length + (posts.length === 1 ? ' повідомлення' : ' повідомлень');
      if (!posts.length) {
        feed.innerHTML = '<div class="empty">Тут поки тихо. Залиш першу думку.</div>';
        return;
      }
      feed.replaceChildren(...posts.map(post => {
        const article = document.createElement('article');
        article.className = 'post';
        const meta = document.createElement('div');
        meta.className = 'meta';
        const identity = document.createElement('div');
        identity.className = 'identity';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.backgroundColor = post.profile.hex_login;
        const hex = document.createElement('span');
        hex.className = 'hex';
        hex.textContent = post.profile.hex_login.toLowerCase();
        identity.append(swatch, hex);
        const time = document.createElement('time');
        time.dateTime = post.created_at;
        time.textContent = kyivTime(post.created_at) + ' · ' + kyivDate(post.created_at);
        const message = document.createElement('p');
        message.className = 'message';
        message.textContent = post.content;
        meta.append(identity, time);
        article.append(meta, message);
        return article;
      }));
    }

    async function loadFeed() {
      const { data, error } = await supabase
        .from('copypaste_posts')
        .select('id, content, created_at, author_id, profile:copypaste_profiles!copypaste_posts_author_id_fkey(hex_login)')
        .order('created_at', { ascending: false })
        .limit(100);
      if (error) throw error;
      renderPosts(data || []);
      if (currentUser) {
        const { data: mine, error: mineError } = await supabase
          .from('copypaste_posts')
          .select('id')
          .eq('author_id', currentUser.id)
          .limit(1);
        if (mineError) throw mineError;
        alreadyPosted = (mine || []).length > 0;
        if (alreadyPosted) {
          input.disabled = true;
          input.placeholder = 'Ти вже залишив повідомлення сьогодні. Побачимось завтра.';
          setStatus('Твоє повідомлення на сьогодні вже опубліковане.');
        }
        updateComposer();
      }
    }

    input.addEventListener('input', updateComposer);
    publish.addEventListener('click', async () => {
      const content = input.value.trim();
      if (!content || !currentUser || alreadyPosted) return;
      publish.disabled = true;
      setStatus('Публікуємо…');
      const { error } = await supabase.from('copypaste_posts').insert({ content });
      if (error) {
        if (error.code === '23505') {
          alreadyPosted = true;
          input.disabled = true;
          input.placeholder = 'Ти вже залишив повідомлення сьогодні. Побачимось завтра.';
          setStatus('На сьогодні ти вже опублікував повідомлення.');
        } else {
          setStatus('Не вдалося опублікувати. Спробуй ще раз.', true);
        }
        updateComposer();
        return;
      }
      input.value = '';
      alreadyPosted = true;
      input.disabled = true;
      input.placeholder = 'Ти вже залишив повідомлення сьогодні. Побачимось завтра.';
      setStatus('Опубліковано. До зустрічі завтра.');
      updateComposer();
      await loadFeed();
    });

    try {
      await ensureIdentity();
      setStatus('Твій сьогоднішній голос: ' + myHex.toLowerCase());
      await loadFeed();
      updateComposer();
      window.setInterval(() => loadFeed().catch(() => {}), 30000);
    } catch (error) {
      console.error(error);
      setStatus('Не вдалося підключитися. Перевір налаштування анонімного входу в Supabase.', true);
      feed.innerHTML = '<div class="empty">Потік тимчасово недоступний.</div>';
    }
  </script>
</body>
</html>
