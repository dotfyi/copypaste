<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="copypaste — одна думка на день. Спільний потік повідомлень.">
  <title>copypaste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:light; --ink:#111; --muted:#888; --line:#e9e9e9; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#fff; }
    body { color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    .shell { width:min(100% - 40px, 660px); margin:0 auto; padding:42px 0 64px; }
    header { margin-bottom:54px; }
    .brand { font-size:25px; font-weight:700; letter-spacing:-.075em; line-height:1; }
    .composer { margin-bottom:48px; }
    textarea { display:block; width:100%; min-height:54px; height:54px; resize:vertical; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:7px 0 9px; color:var(--ink); background:transparent; font-family:inherit; font-size:17px; line-height:1.55; outline:none; }
    textarea::placeholder { color:#aaa; }
    textarea:focus { border-bottom-color:#111; }
    textarea:disabled { color:#999; resize:none; }
    .compose-row { display:flex; justify-content:space-between; align-items:center; gap:16px; padding-top:13px; }
    .counter,.status { color:var(--muted); font-size:11px; }
    button { border:0; border-radius:0; padding:0; min-height:0; background:transparent; color:#111; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; }
    button:hover:not(:disabled) { text-decoration:underline; text-underline-offset:3px; }
    button:disabled { color:#aaa; cursor:default; }
    .status { min-height:15px; margin-top:11px; }
    .error { color:#b42318; }
    .feed-head { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:0 0 15px; }
    .feed-title { font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
    .feed-count { color:var(--muted); font-size:11px; }
    .post { padding:19px 0 21px; border-top:1px solid var(--line); }
    .meta { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:9px; color:var(--muted); font-size:11px; }
    .identity { display:flex; align-items:center; min-width:0; }
    .swatch { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:8px; flex:0 0 auto; }
    .hex { letter-spacing:.015em; color:#111 !important; }
    time { white-space:nowrap; }
    .message { margin:0; font-size:16px; line-height:1.6; letter-spacing:-.018em; overflow-wrap:anywhere; white-space:pre-wrap; }
    .empty { padding:24px 0; color:var(--muted); font-size:13px; border-top:1px solid var(--line); }
    @media (max-width:560px) {
      .shell { width:calc(100% - 36px); padding:30px 0 48px; }
      header { margin-bottom:43px; }
      .brand { font-size:23px; }
      .composer { margin-bottom:40px; }
      textarea { min-height:50px; height:50px; padding:6px 0 8px; font-size:16px; }
      .post { padding:17px 0 19px; }
      .message { font-size:16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand">copypaste</div></header>

    <section class="composer" aria-label="Нове повідомлення">
      <textarea id="message" maxlength="280" placeholder="Про що ти думаєш сьогодні?" aria-label="Твоє повідомлення"></textarea>
      <div class="compose-row">
        <span class="counter" id="counter">0 / 280</span>
        <button id="publish" type="button" disabled>Опублікувати ↗</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite">Підключаємося…</div>
    </section>

    <section aria-label="Усі повідомлення">
      <div class="feed-head">
        <span class="feed-title">Потік</span>
        <span class="feed-count" id="feed-count">—</span>
      </div>
      <div id="feed" aria-live="polite"><div class="empty">Завантажуємо потік…</div></div>
    </section>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';

    const SUPABASE_URL = 'https://ebngdngtlrzdzaojsggl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QxMbOMYZY_JcIO2M5ozPDQ_Uc4mykOf';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });

    const input = document.querySelector('#message');
    const counter = document.querySelector('#counter');
    const publish = document.querySelector('#publish');
    const status = document.querySelector('#status');
    const feed = document.querySelector('#feed');
    const feedCount = document.querySelector('#feed-count');
    let currentUser = null;
    let myHex = null;
    let alreadyPosted = false;
    let isAdmin = false;

    const kyivToday = () => {
      const parts = new Intl.DateTimeFormat('en-CA', {
        year:'numeric', month:'2-digit', day:'2-digit', timeZone:'Europe/Kyiv'
      }).formatToParts(new Date());
      const part = (type) => parts.find(item => item.type === type).value;
      return part('year') + '-' + part('month') + '-' + part('day');
    };
    const kyivDate = (value) => new Intl.DateTimeFormat('uk-UA', {
      day:'2-digit', month:'2-digit', year:'numeric', timeZone:'Europe/Kyiv'
    }).format(new Date(value));
    const kyivTime = (value) => new Intl.DateTimeFormat('uk-UA', {
      hour:'2-digit', minute:'2-digit', timeZone:'Europe/Kyiv'
    }).format(new Date(value));

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function updateComposer() {
      counter.textContent = input.value.length + ' / 280';
      publish.disabled = !currentUser || alreadyPosted || !input.value.trim() || input.value.length > 280;
      publish.disabled = !currentUser || (!isRegistration && alreadyPosted) || !input.value.trim() || input.value.length > 280;
    }

    async function ensureIdentity() {
      const { data: sessionData } = await supabase.auth.getSession();
      if (sessionData.session?.user) {
        currentUser = sessionData.session.user;
      } else {
        const { data, error } = await supabase.auth.signInAnonymously();
        if (error) throw error;
        currentUser = data.user;
      }

      let profile = null;
      for (let attempt = 0; attempt < 6; attempt++) {
        const { data, error } = await supabase
          .from('copypaste_profiles')
          .select('hex_login, is_admin')
          .eq('id', currentUser.id)
          .maybeSingle();
        if (!error && data) { profile = data; break; }
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      if (!profile) throw new Error('Не вдалося створити твій HEX-логін. Онови сторінку.');
      myHex = profile.hex_login;
      isAdmin = !!profile.is_admin;
    }

    function renderPosts(posts) {
      feedCount.textContent = posts.length + (posts.length === 1 ? ' повідомлення' : ' повідомлень');
      if (!posts.length) {
        feed.innerHTML = '<div class="empty">Тут поки тихо. Залиш першу думку.</div>';
        return;
      }
      feed.replaceChildren(...posts.map(post => {
        const article = document.createElement('article');
        article.className = 'post';
        const meta = document.createElement('div');
        meta.className = 'meta';
        const identity = document.createElement('div');
        identity.className = 'identity';
        const hex = document.createElement('span');
        hex.className = 'hex';
        hex.textContent = post.profile.hex_login.toLowerCase();
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.backgroundColor = post.profile.hex_login;
        identity.append(swatch, hex);
        const time = document.createElement('time');
        time.dateTime = post.created_at;
        time.textContent = kyivTime(post.created_at) + ' · ' + kyivDate(post.created_at);
        const message = document.createElement('p');
        message.className = 'message';
        message.textContent = post.content;
        meta.append(identity, time);
        article.append(meta, message);
        return article;
      }));
    }

    async function loadFeed() {
      const { data, error } = await supabase
        .from('copypaste_posts')
        .select('id, content, created_at, author_id, profile:copypaste_profiles!copypaste_posts_author_id_fkey(hex_login)')
        .order('created_at', { ascending: false })
        .limit(100);
      if (error) throw error;
      renderPosts(data || []);
      if (currentUser) {
        const { data: mine, error: mineError } = await supabase
          .from('copypaste_posts')
          .select('id')
          .eq('author_id', currentUser.id)
          .eq('post_day', kyivToday())
          .limit(1);
        if (mineError) throw mineError;
        alreadyPosted = !isAdmin && (mine || []).length > 0;
        if (alreadyPosted) {
          input.placeholder = 'Ти вже залишив повідомлення сьогодні. Побачимось завтра.';
          setStatus('');
        }
        updateComposer();
      }
    }

    input.addEventListener('input', updateComposer);
    publish.addEventListener('click', async () => {
      const content = input.value.trim();
      if (!content || !currentUser || alreadyPosted) return;
      publish.disabled = true;
      setStatus('Публікуємо…');
      const { error } = await supabase.from('copypaste_posts').insert({ content });
      if (error) {
        if (error.code === '23505') {
          alreadyPosted = true;
          input.placeholder = 'Ти вже залишив повідомлення сьогодні. Побачимось завтра.';
          setStatus('');
        } else {
          setStatus('Не вдалося опублікувати. Спробуй ще раз.', true);
        }
        updateComposer();
        return;
      }
      input.value = '';
      alreadyPosted = true;
      if (!isAdmin) input.placeholder = 'Ти вже залишив повідомлення сьогодні. Побачимось завтра.';
      setStatus(isAdmin ? 'Опубліковано.' : 'Опубліковано. До зустрічі завтра.');
      updateComposer();
      await loadFeed();
    });

    try {
      await ensureIdentity();
      setStatus('');
      await loadFeed();
      updateComposer();
      window.setInterval(() => loadFeed().catch(() => {}), 30000);
    } catch (error) {
      console.error(error);
      setStatus('Не вдалося підключитися. Перевір налаштування анонімного входу в Supabase.', true);
      feed.innerHTML = '<div class="empty">Потік тимчасово недоступний.</div>';
    }
  </script>
</body>
</html>
