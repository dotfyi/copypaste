<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="copypaste — одна думка на день. Спільний потік повідомлень.">
  <title>copypaste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:light; --ink:#111; --muted:#888; --line:#e9e9e9; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#fff; }
    body { color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    .shell { width:min(100% - 40px, 660px); margin:0 auto; padding:36px 0 64px; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:48px; }
    .brand { font-size:25px; letter-spacing:-.075em; line-height:1; }
    .brand strong { font-weight:800; } .brand span { font-weight:400; }
    .nav { display:flex; align-items:center; gap:28px; }
    .icon-btn,.topic-btn,.format-btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; color:#555; }
    .icon-btn svg,.topic-btn svg,.format-btn svg { width:18px; height:18px; stroke-width:1.7; }
    .icon-btn:disabled { opacity:.35; }
    .composer { margin-bottom:42px; }
    textarea { display:block; width:100%; min-height:38px; height:38px; resize:none; border:0; border-bottom:1px solid var(--line); border-radius:0; padding:5px 0 7px; color:var(--ink); background:transparent; font-family:inherit; font-size:16px; line-height:1.5; outline:none; }
    textarea::placeholder { color:#aaa; } textarea:focus { border-bottom-color:#111; }
    .compose-row { display:flex; justify-content:space-between; align-items:center; gap:16px; padding-top:10px; }
    .counter,.status { color:var(--muted); font-size:11px; }
    button { border:0; border-radius:0; padding:0; min-height:0; background:transparent; color:#111; font-family:inherit; font-size:12px; font-weight:600; cursor:pointer; }
    button:hover:not(:disabled) { text-decoration:underline; text-underline-offset:3px; }
    button:disabled { color:#aaa; cursor:default; }
    .status { min-height:0; margin-top:7px; } .status:empty { display:none; }
    .error { color:#b42318; }
    .formatbar { display:flex; gap:16px; align-items:center; padding:12px 0 2px; }
    .format-btn { font-size:12px; }
    .topics { display:flex; flex-wrap:wrap; gap:7px; padding:0 0 14px; margin-bottom:0; border:0; }
    .topic-btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; white-space:nowrap; border-radius:999px; padding:7px 10px; min-height:30px; color:#333; font-size:11px; font-weight:600; transition:filter .15s; }
    .topic-btn svg { width:15px; height:15px; stroke-width:1.8; }
    .topic-btn:hover:not(:disabled) { background:#333; text-decoration:none; }
    .topic-btn.active { background:#111; color:#fff; outline:2px solid #111; outline-offset:2px; }
    
    .post { padding:18px 0 20px; border-top:1px solid var(--line); }
    .meta { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:8px; color:var(--muted); font-size:11px; }
    .identity { display:flex; align-items:center; min-width:0; }
    .swatch { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:8px; flex:0 0 auto; }
    .hex { letter-spacing:.015em; color:#111 !important; } time { white-space:nowrap; }
    .message { margin:0; font-size:15px; line-height:1.65; letter-spacing:-.018em; overflow-wrap:anywhere; white-space:pre-wrap; }
    .message strong { font-weight:700; } .message em { font-style:italic; } .message del { text-decoration:line-through; }
    .green-text { color:#27834b; }
    .spoiler { display:inline-block; cursor:pointer; background:#e8e8e8; border-radius:6px; padding:0 6px; }
    .empty { padding:24px 0; color:var(--muted); font-size:13px; border-top:1px solid var(--line); }
    .page-panel { border-top:1px solid var(--line); padding:20px 0; font-size:14px; line-height:1.7; }
    .page-panel h2 { font-size:16px; font-weight:600; margin:0 0 16px; }
    .page-panel h3 { font-size:13px; font-weight:600; margin:20px 0 5px; }
    .page-panel p { margin:0 0 12px; color:#555; }
    .page-panel ul { margin:0; padding-left:18px; color:#555; }
    .load-more { display:block; width:100%; padding:20px 0; color:#888; text-align:center; }
    #sentinel { height:1px; }
    @media (max-width:560px) {
      .shell { width:calc(100% - 36px); padding:28px 0 48px; }
      header { margin-bottom:38px; } .brand { font-size:23px; }
      .nav { gap:22px; } .topics { gap:10px; }
      .post { padding:16px 0 18px; } .message { font-size:15px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><strong>COPY</strong><span>PASTE</span></div>
      <nav class="nav" aria-label="Навігація">
        <button class="icon-btn" id="auth-nav" type="button" disabled aria-label="Авторизація" title="Авторизація скоро"><i data-lucide="user-round"></i></button>
        <button class="icon-btn" id="rules-nav" type="button" aria-label="Правила" title="Правила"><i data-lucide="book-open"></i></button>
        <button class="icon-btn" id="faq-nav" type="button" aria-label="FAQ" title="FAQ"><i data-lucide="circle-help"></i></button>
      </nav>
    </header>

    <section id="main-view">
      <section class="composer" aria-label="Нове повідомлення">
        <textarea id="message" maxlength="180" placeholder="Про що ти думаєш сьогодні?" aria-label="Твоє повідомлення"></textarea>
        <div class="compose-row">
          <span class="counter" id="counter">0 / 180</span>
          <button id="publish" type="button" disabled>Опублікувати ↗</button>
        </div>
        <div class="status" id="status" role="status" aria-live="polite">Підключаємося…</div>
      </section>

      <section aria-label="Усі повідомлення">
        <div class="topics" id="topics">
          <button class="topic-btn active" type="button" data-topic="general"><i data-lucide="globe-2"></i> Загальне</button>
          <button class="topic-btn" type="button" data-topic="games"><i data-lucide="gamepad-2"></i> Ігри</button>
          <button class="topic-btn" type="button" data-topic="technology"><i data-lucide="cpu"></i> Технології</button>
          <button class="topic-btn" type="button" data-topic="books"><i data-lucide="book-open"></i> Книги</button>\n          <button class="topic-btn" type="button" data-topic="art"><i data-lucide="palette"></i> Мистецтво</button>
        </div>
        <div id="feed" aria-live="polite"><div class="empty">Завантажуємо потік…</div></div>
        <div id="sentinel"></div>
      </section>
    </section>
    <section id="info-view" class="page-panel" hidden></section>
  </main>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.4';
    import { createIcons, Bold, Italic, Strikethrough, UserRound, BookOpen, CircleHelp, Globe2, Gamepad2, Cpu, TextCursor, EyeOff, Palette } from 'https://esm.sh/lucide@0.468.0';

    const SUPABASE_URL = 'https://ebngdngtlrzdzaojsggl.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QxMbOMYZY_JcIO2M5ozPDQ_Uc4mykOf';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
    });

    const input = document.querySelector('#message');
    const counter = document.querySelector('#counter');
    const publish = document.querySelector('#publish');
    const status = document.querySelector('#status');
    const feed = document.querySelector('#feed');
    const infoView = document.querySelector('#info-view');
    const mainView = document.querySelector('#main-view');
    const sentinel = document.querySelector('#sentinel');
    const PAGE_SIZE = 30;
    let activeTopic = 'general';
    let pageOffset = 0;
    let loadingMore = false;
    let hasMore = true;
    let totalInTopic = 0;
    createIcons({ icons: { Bold, Italic, Strikethrough, UserRound, BookOpen, CircleHelp, Globe2, Gamepad2, Cpu, TextCursor, EyeOff, Palette } });
    let currentUser = null;
    let myHex = null;
    let alreadyPosted = false;
    let isAdmin = false;
    let authBusy = false;

    const kyivToday = () => {
      const parts = new Intl.DateTimeFormat('en-CA', {
        year:'numeric', month:'2-digit', day:'2-digit', timeZone:'Europe/Kyiv'
      }).formatToParts(new Date());
      const part = (type) => parts.find(item => item.type === type).value;
      return part('year') + '-' + part('month') + '-' + part('day');
    };
    const kyivDate = (value) => {
      const d = new Date(value);
      const parts = new Intl.DateTimeFormat('en-GB', { day:'2-digit', month:'2-digit', year:'2-digit', timeZone:'Europe/Kyiv' }).format(d);
      return parts;
    };
    const pluralPosts = (n) => {
      const n10 = n % 10, n100 = n % 100;
      if (n10 === 1 && n100 !== 11) return 'повідомлення';
      if (n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return 'повідомлення';
      return 'повідомлень';
    };
    const kyivTime = (value) => new Intl.DateTimeFormat('uk-UA', {
      hour:'2-digit', minute:'2-digit', timeZone:'Europe/Kyiv'
    }).format(new Date(value));

    function setStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle('error', isError);
    }

    function updateComposer() {
      counter.textContent = input.value.length + ' / 180';
      const command = /^\/(registration|auth)(?:\s+\S+)?$/i.test(input.value.trim());
      publish.textContent = command ? 'Виконати ↗' : 'Опублікувати ↗';
      publish.disabled = authBusy || (!command && (!currentUser || (!isAdmin && alreadyPosted) || !input.value.trim() || input.value.length > 180));
    }

    async function ensureIdentity() {
      const { data: sessionData } = await supabase.auth.getSession();
      if (sessionData.session?.user) {
        currentUser = sessionData.session.user;
      } else {
        const { data, error } = await supabase.auth.signInAnonymously();
        if (error) throw error;
        currentUser = data.user;
      }

      let profile = null;
      for (let attempt = 0; attempt < 6; attempt++) {
        const { data, error } = await supabase
          .from('copypaste_profiles')
          .select('hex_login, is_admin')
          .eq('id', currentUser.id)
          .maybeSingle();
        if (!error && data) { profile = data; break; }
        await new Promise(resolve => setTimeout(resolve, 250));
      }
      if (!profile) throw new Error('Не вдалося створити твій HEX-логін. Онови сторінку.');
      myHex = profile.hex_login;
      isAdmin = !!profile.is_admin;
    }

    function appendFormattedText(parent, raw) {
      const token = /(\*\*[^*]+\*\*|\*[^*]+\*|~~[^~]+~~|\|\|[^|]+\|\||>[^\n]+)/gm;
      let last = 0, match;
      while ((match = token.exec(raw)) !== null) {
        if (match.index > last) parent.append(document.createTextNode(raw.slice(last, match.index)));
        const value = match[0];
        let el;
        if (value.startsWith('**')) { el = document.createElement('strong'); el.textContent = value.slice(2, -2); }
        else if (value.startsWith('~~')) { el = document.createElement('del'); el.textContent = value.slice(2, -2); }
        else if (value.startsWith('||')) {
          el = document.createElement('span'); el.className = 'spoiler'; el.textContent = value.slice(2, -2);
          el.addEventListener('click', () => el.classList.toggle('revealed'));
        } else if (value.startsWith('*')) { el = document.createElement('em'); el.textContent = value.slice(1, -1); }
        else { el = document.createElement('span'); el.className = 'green-text'; el.textContent = value.slice(1); }
        parent.append(el);
        last = token.lastIndex;
      }
      if (last < raw.length) parent.append(document.createTextNode(raw.slice(last)));
    }

    function renderPosts(posts, append = false) {
      if (!append) feed.replaceChildren();
      if (!posts.length && !append) {
        feed.innerHTML = '<div class="empty">Тут поки тихо. Залиш першу думку.</div>';
        return;
      }
      const nodes = posts.map(post => {
        const article = document.createElement('article');
        article.className = 'post';
        const meta = document.createElement('div');
        meta.className = 'meta';
        const identity = document.createElement('div');
        identity.className = 'identity';
        const hex = document.createElement('span');
        hex.className = 'hex';
        hex.textContent = post.profile?.hex_login?.toLowerCase() || '#??????';
        const swatch = document.createElement('span');
        swatch.className = 'swatch';
        swatch.style.backgroundColor = post.profile?.hex_login || '#aaa';
        identity.append(swatch, hex);
        const time = document.createElement('time');
        time.dateTime = post.created_at;
        time.textContent = kyivTime(post.created_at) + ' • ' + kyivDate(post.created_at);
        const message = document.createElement('p');
        message.className = 'message';
        appendFormattedText(message, post.content);
        meta.append(identity, time);
        article.append(meta, message);
        return article;
      });
      feed.append(...nodes);
    }

    async function loadFeed(reset = false) {
      if (loadingMore) return;
      if (reset) { pageOffset = 0; hasMore = true; feed.replaceChildren(); }
      if (!hasMore) return;
      loadingMore = true;
      try {
        const { data, error, count } = await supabase
          .from('copypaste_posts')
          .select('id, content, created_at, author_id, topic, profile:copypaste_profiles!copypaste_posts_author_id_fkey(hex_login)', { count: 'exact' })
          .eq('topic', activeTopic)
          .order('created_at', { ascending: false })
          .range(pageOffset, pageOffset + PAGE_SIZE - 1);
        if (error) throw error;
        totalInTopic = count || 0;
        renderPosts(data || [], pageOffset > 0);
        pageOffset += (data || []).length;
        hasMore = (data || []).length === PAGE_SIZE && pageOffset < totalInTopic;
        if (currentUser && reset) {
          const { data: mine, error: mineError } = await supabase
            .from('copypaste_posts').select('id').eq('author_id', currentUser.id).eq('post_day', kyivToday()).limit(1);
          if (mineError) throw mineError;
          alreadyPosted = !isAdmin && (mine || []).length > 0;
          if (alreadyPosted) input.placeholder = 'Ти вже залишив повідомлення сьогодні. Побачимось завтра.';
          updateComposer();
        }
      } finally { loadingMore = false; }
    }

    const topicLabels = { general:'Загальне', games:'Ігри', technology:'Технології', books:'Книги', art:'Мистецтво' };
    function showInfo(which) {
      const pages = {
        rules: '<h2>Правила</h2><h3>Будь людиною</h3><p>Поважай інших. Без образ, погроз, мови ненависті та переслідування.</p><h3>Пиши по суті</h3><p>Одна думка — одне повідомлення. До 180 символів. Не публікуй приватні дані.</p><h3>Форматування</h3><p>Використовуй виділення, але не зловживай ним. Спойлери позначай окремо.</p><h3>Модерація</h3><p>Шкідливий або незаконний контент може бути видалений.</p>',
        faq: '<h2>FAQ</h2><h3>Скільки можна публікувати?</h3><p>Звичайний акаунт — одне повідомлення на день.</p><h3>Як відформатувати текст?</h3><p>**жирний**, *курсив*, ~~закреслений~~, &gt;зелений текст, ||спойлер||.</p><h3>Як працюють теми?</h3><p>Обери тему над стрічкою. Нові повідомлення потраплять саме до неї.</p><h3>Чи можна повернутися до акаунта?</h3><p>Так, за допомогою секретного ключа авторизації, коли вона стане доступною в інтерфейсі.</p>'
      };
      mainView.hidden = true;
      infoView.hidden = false;
      infoView.innerHTML = pages[which];
      document.querySelector('#rules-nav').classList.toggle('active', which === 'rules');
      document.querySelector('#faq-nav').classList.toggle('active', which === 'faq');
    }
    function showMain() {
      infoView.hidden = true; mainView.hidden = false;
      document.querySelector('#rules-nav').classList.remove('active');
      document.querySelector('#faq-nav').classList.remove('active');
    }
    document.querySelector('#rules-nav').addEventListener('click', () => showInfo('rules'));
    document.querySelector('#faq-nav').addEventListener('click', () => showInfo('faq'));
    document.querySelector('.brand').addEventListener('click', showMain);
    document.querySelectorAll('[data-topic]').forEach(button => button.addEventListener('click', async () => {
      activeTopic = button.dataset.topic;
      document.querySelectorAll('[data-topic]').forEach(b => b.classList.toggle('active', b === button));
      await loadFeed(true);
    }));
    const feedObserver = new IntersectionObserver(entries => {
      if (entries.some(entry => entry.isIntersecting) && hasMore && !loadingMore) loadFeed(false).catch(err => console.error(err));
    }, { rootMargin: '500px' });
    feedObserver.observe(sentinel);

        async function runAuthCommand(action, secretKey = '') {
      authBusy = true;
      updateComposer();
      setStatus(action === 'register' ? 'Створюємо постійний акаунт…' : 'Перевіряємо секретний ключ…');
      try {
        const { data, error } = await supabase.functions.invoke('copypaste-auth', {
          body: action === 'register' ? { action: 'register' } : { action: 'login', secretKey }
        });
        if (error || data?.error) throw new Error(data?.error || 'Не вдалося виконати команду.');
        const { error: sessionError } = await supabase.auth.setSession({ access_token: data.access_token, refresh_token: data.refresh_token });
        if (sessionError) throw sessionError;
        const { data: userData, error: userError } = await supabase.auth.getUser();
        if (userError || !userData.user) throw userError || new Error('Не вдалося відкрити сесію.');
        currentUser = userData.user;
        myHex = data.hexLogin;
        isAdmin = !!data.isAdmin;
        alreadyPosted = false;
        input.value = '';
        input.placeholder = 'Про що ти думаєш сьогодні?';
        setStatus('');
        if (action === 'register') {
          status.textContent = 'Логін: ' + data.hexLogin + ' · Секретний ключ: ' + data.secretKey + ' — збережи його, він показується лише один раз. ';
          const copy = document.createElement('button');
          copy.type = 'button'; copy.textContent = 'Копіювати ключ'; copy.style.marginLeft = '8px';
          copy.addEventListener('click', async () => {
            try { await navigator.clipboard.writeText(data.secretKey); copy.textContent = 'Скопійовано'; }
            catch { copy.textContent = 'Скопіюй ключ вручну'; }
          });
          status.append(copy);
        } else setStatus('Ти увійшов як ' + data.hexLogin + '.');
        await loadFeed(true);
      } catch (error) {
        setStatus(error.message || 'Помилка авторизації.', true);
      } finally { authBusy = false; updateComposer(); }
    }

    input.addEventListener('input', updateComposer);
    publish.addEventListener('click', async () => {
      const content = input.value.trim();
      if (/^\/registration$/i.test(content)) { await runAuthCommand('register'); return; }
      if (/^\/registration/i.test(content)) { setStatus('Команда: /registration (доступна лише один раз).', true); return; }
      const authMatch = content.match(/^\/auth\s+(cp_[a-f0-9]{64})$/i);
      if (/^\/auth/i.test(content)) {
        if (!authMatch) { setStatus('Формат: /auth cp_… (встав повний секретний ключ).', true); return; }
        await runAuthCommand('login', authMatch[1]); return;
      }
      if (!content || !currentUser || (!isAdmin && alreadyPosted)) return;
      publish.disabled = true;
      setStatus('');
      const { error } = await supabase.from('copypaste_posts').insert({ content, topic: activeTopic });
      if (error) {
        if (error.code === '23505') {
          alreadyPosted = true;
          input.placeholder = 'Ти вже залишив повідомлення сьогодні. Побачимось завтра.';
          setStatus('');
        } else setStatus('Не вдалося опублікувати. Спробуй ще раз.', true);
        updateComposer();
        return;
      }
      input.value = '';
      alreadyPosted = true;
      if (!isAdmin) input.placeholder = 'Ти вже залишив повідомлення сьогодні. Побачимось завтра.';
      setStatus('');
      updateComposer();
      await loadFeed(true);
    });

    try {
      await ensureIdentity();
      setStatus('');
      await loadFeed(true);
      updateComposer();
      window.setInterval(() => loadFeed(true).catch(() => {}), 30000);
    } catch (error) {
      console.error(error);
      setStatus('Не вдалося підключитися. Перевір налаштування анонімного входу в Supabase.', true);
      feed.innerHTML = '<div class="empty">Потік тимчасово недоступний.</div>';
    }
  </script>
</body>
</html>
